# DSR の基本動作確認用。L7LB ノード上の Pod（whoami）を L4LB の VIP で公開し、Pod が見た送信元を応答で返す。
apiVersion: v1
kind: Namespace
metadata:
  name: lab-probe
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: whoami
  namespace: lab-probe
spec:
  selector:
    matchLabels: {app: whoami}
  template:
    metadata:
      labels: {app: whoami}
    spec:
      nodeSelector:
        lab.infra/group: l7lb
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          args: ["--port=8080"]
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: lab-probe
  labels:
    lab.infra/l4lb: "true"
  annotations:
    lbipam.cilium.io/ips: 10.240.250.10
spec:
  type: LoadBalancer
  selector: {app: whoami}
  ports:
    - port: 80
      targetPort: 8080
