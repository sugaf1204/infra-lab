# L7LB（nginx のリバースプロキシ）。L4LB の VIP から Geneve DSR で受け、VM の固定 IP に HTTP を中継する。
# 同じ Pod 定義を 2 通りに配置する:
#   l7lb-worker  : L7LB frontend ノードグループ（専用 Kubernetes ワーカー）
#   l7lb-compute : OpenStack compute ノードの DaemonSet
# L7LB が受けたクライアントアドレスは応答ヘッダー X-L7LB-Client、処理ノードは X-L7LB-Node で確認する。
apiVersion: v1
kind: Namespace
metadata:
  name: lab-l7lb
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx
  namespace: lab-l7lb
data:
  default.conf.template: |
    upstream vms {
      server 10.250.0.11:80;
      server 10.250.0.12:80;
    }
    server {
      listen 8080;
      location / {
        proxy_pass http://vms;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout;
        add_header X-L7LB-Client $remote_addr always;
        add_header X-L7LB-Node ${NODE_NAME} always;
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: l7lb-worker
  namespace: lab-l7lb
spec:
  selector:
    matchLabels: {app: l7lb, placement: worker}
  template:
    metadata:
      labels: {app: l7lb, placement: worker}
    spec:
      nodeSelector:
        lab.infra/group: l7lb
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - containerPort: 8080
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/templates}
      volumes:
        - name: conf
          configMap: {name: nginx}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: l7lb-compute
  namespace: lab-l7lb
spec:
  selector:
    matchLabels: {app: l7lb, placement: compute}
  template:
    metadata:
      labels: {app: l7lb, placement: compute}
    spec:
      nodeSelector:
        lab.infra/group: openstack-compute
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - containerPort: 8080
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/templates}
      volumes:
        - name: conf
          configMap: {name: nginx}
---
apiVersion: v1
kind: Service
metadata:
  name: l7lb-worker
  namespace: lab-l7lb
  labels: {lab.infra/l4lb: "true"}
  annotations: {lbipam.cilium.io/ips: 10.240.250.30}
spec:
  type: LoadBalancer
  selector: {app: l7lb, placement: worker}
  ports:
    - {port: 80, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: l7lb-compute
  namespace: lab-l7lb
  labels: {lab.infra/l4lb: "true"}
  annotations: {lbipam.cilium.io/ips: 10.240.250.31}
spec:
  type: LoadBalancer
  selector: {app: l7lb, placement: compute}
  ports:
    - {port: 80, targetPort: 8080}
