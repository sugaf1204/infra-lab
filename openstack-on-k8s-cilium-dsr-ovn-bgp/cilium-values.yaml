k8sServiceHost: osk-bgp-control-plane
k8sServicePort: 6443
ipam:
  mode: kubernetes
routingMode: native
# DSR の Geneve dispatch 用。Pod 間の通常転送は native routing のまま。
tunnelProtocol: geneve
# Pod → VM（10.250.0.0/24）を MASQUERADE しない。VM と Pod・ノードを同じ 10.240.0.0/12 に収める。
ipv4NativeRoutingCIDR: 10.240.0.0/12
autoDirectNodeRoutes: false
endpointRoutes:
  enabled: true
enableIPv4Masquerade: true
bpf:
  hostLegacyRouting: true
  masquerade: false
bgpControlPlane:
  enabled: true
kubeProxyReplacement: true
loadBalancer:
  mode: dsr
  dsrDispatch: geneve
  algorithm: maglev
socketLB:
  enabled: false
devices: "k8s-leaf+,lo"
nodePort:
  directRoutingDevice: "lo"
rollOutCiliumPods: true
image:
  useDigest: false
envoy:
  enabled: false
operator:
  replicas: 1
  image:
    useDigest: false
extraConfig:
  # VM 用の CiliumEndpoint（vm-backend.sh）は compute ノードの IP を持つがローカルに実体がない。
  # agent は起動時にこれを stale とみなして削除するため、起動時の掃除を無効にする。
  # Pod 由来の残骸は cilium-operator の CEP GC が引き続き回収する。
  enable-stale-cilium-endpoint-cleanup: "false"
