name: full-l3-ip-clos
mgmt:
  network: full-l3-ip-clos-mgmt
  skip-when-unused: true
topology:
  kinds:
    linux:
      network-mode: none
      image: quay.io/frrouting/frr:10.4.1
  groups:
    router:
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv6.conf.all.disable_ipv6: 0
        net.ipv6.conf.default.disable_ipv6: 0
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
      binds:
        - ../common/frr/daemons:/etc/frr/daemons:ro
  nodes:
    leaf1:
      kind: linux
      group: router
      binds:
        - frr/leaf1.conf:/etc/frr/frr.conf:ro
    leaf2:
      kind: linux
      group: router
      binds:
        - frr/leaf2.conf:/etc/frr/frr.conf:ro
    spine1:
      kind: linux
      group: router
      binds:
        - frr/spine1.conf:/etc/frr/frr.conf:ro
    spine2:
      kind: linux
      group: router
      binds:
        - frr/spine2.conf:/etc/frr/frr.conf:ro
    host1:
      kind: linux
      group: router
      network-mode: none
      sysctls:
        net.ipv6.conf.default.accept_ra_defrtr: 0
      binds:
        - frr/host1.conf:/etc/frr/frr.conf:ro
      exec:
        - ip -4 addr replace 10.211.1.2/32 dev lo
    host2:
      kind: linux
      group: router
      network-mode: none
      sysctls:
        net.ipv6.conf.default.accept_ra_defrtr: 0
      binds:
        - frr/host2.conf:/etc/frr/frr.conf:ro
      exec:
        - ip -4 addr replace 10.211.2.2/32 dev lo
  links:
    - endpoints: ["leaf1:eth1", "spine1:eth1"]
    - endpoints: ["leaf1:eth2", "spine2:eth1"]
    - endpoints: ["leaf2:eth1", "spine1:eth2"]
    - endpoints: ["leaf2:eth2", "spine2:eth2"]
    - endpoints: ["leaf1:eth3", "host1:eth1"]
    - endpoints: ["leaf1:eth4", "host2:eth1"]
    - endpoints: ["leaf2:eth3", "host1:eth2"]
    - endpoints: ["leaf2:eth4", "host2:eth2"]
