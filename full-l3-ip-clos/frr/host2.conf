frr defaults traditional
hostname host2
!
ip prefix-list DEFAULT permit 0.0.0.0/0
ip prefix-list HOST permit 10.211.2.2/32
!
router bgp 65212
 bgp router-id 10.211.2.2
 no bgp default ipv4-unicast
 neighbor eth1 interface remote-as 65102
 !
 address-family ipv4 unicast
  network 10.211.2.2/32
  neighbor eth1 activate
  neighbor eth1 prefix-list DEFAULT in
  neighbor eth1 prefix-list HOST out
 exit-address-family
!
