frr defaults datacenter
hostname leaf1
!
router bgp 65101
 bgp router-id 10.211.255.1
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor 10.211.0.1 remote-as 65001
 neighbor 10.211.0.1 timers 3 9
 neighbor 10.211.0.3 remote-as 65002
 neighbor 10.211.0.3 timers 3 9
 !
 address-family ipv4 unicast
  neighbor 10.211.0.1 activate
  neighbor 10.211.0.3 activate
  network 10.211.1.0/24
  maximum-paths 2
 exit-address-family
!
