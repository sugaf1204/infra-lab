frr defaults datacenter
hostname leaf1
!
ip prefix-list HOST1 permit 10.211.1.2/32
ip prefix-list HOST2 permit 10.211.2.2/32
ipv6 prefix-list DEFAULT permit ::/0
ipv6 prefix-list DENY-ALL deny ::/0 le 128
!
router bgp 65101
 bgp router-id 10.211.255.1
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor eth1 interface remote-as 65001
 neighbor eth1 timers 3 9
 neighbor eth2 interface remote-as 65002
 neighbor eth2 timers 3 9
 neighbor eth3 interface remote-as 65211
 neighbor eth4 interface remote-as 65212
 !
 address-family ipv4 unicast
  neighbor eth1 activate
  neighbor eth2 activate
  neighbor eth3 activate
  neighbor eth3 prefix-list HOST1 in
  neighbor eth3 prefix-list HOST2 out
  neighbor eth4 activate
  neighbor eth4 prefix-list HOST2 in
  neighbor eth4 prefix-list HOST1 out
  maximum-paths 2
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor eth3 activate
  neighbor eth3 prefix-list DENY-ALL in
  neighbor eth3 prefix-list DEFAULT out
  neighbor eth3 default-originate
  neighbor eth4 activate
  neighbor eth4 prefix-list DENY-ALL in
  neighbor eth4 prefix-list DEFAULT out
  neighbor eth4 default-originate
 exit-address-family
!
