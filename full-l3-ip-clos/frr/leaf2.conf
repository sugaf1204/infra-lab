frr defaults datacenter
hostname leaf2
!
router bgp 65102
 bgp router-id 10.211.255.2
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor 10.211.0.5 remote-as 65001
 neighbor 10.211.0.5 timers 3 9
 neighbor 10.211.0.7 remote-as 65002
 neighbor 10.211.0.7 timers 3 9
 !
 address-family ipv4 unicast
  neighbor 10.211.0.5 activate
  neighbor 10.211.0.7 activate
  network 10.211.2.0/24
  maximum-paths 2
 exit-address-family
!
