frr defaults traditional
hostname host1
!
ip prefix-list REMOTE-HOST permit 10.211.2.2/32
ipv6 prefix-list DEFAULT permit ::/0
ipv6 prefix-list DENY-ALL deny ::/0 le 128
ip prefix-list HOST permit 10.211.1.2/32
!
router bgp 65211
 bgp router-id 10.211.1.2
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor eth1 interface remote-as 65101
 neighbor eth2 interface remote-as 65102
 !
 address-family ipv4 unicast
  network 10.211.1.2/32
  neighbor eth1 activate
  neighbor eth1 prefix-list REMOTE-HOST in
  neighbor eth1 prefix-list HOST out
  neighbor eth2 activate
  neighbor eth2 prefix-list REMOTE-HOST in
  neighbor eth2 prefix-list HOST out
  maximum-paths 2
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor eth1 activate
  neighbor eth1 prefix-list DEFAULT in
  neighbor eth1 prefix-list DENY-ALL out
  neighbor eth2 activate
  neighbor eth2 prefix-list DEFAULT in
  neighbor eth2 prefix-list DENY-ALL out
  maximum-paths 2
 exit-address-family
!
