- name: Render fabric FRR configurations on the Containerlab host
  hosts: all
  gather_facts: false
  vars_files:
    - "{{ lab_dir }}/nodes.yml"
  tasks:
    - name: Create configuration directory
      ansible.builtin.file:
        path: "{{ lab_dir }}/rendered"
        state: directory
        mode: "0755"

    - name: Render each node's routing policy
      ansible.builtin.template:
        src: "{{ lab_dir }}/frr/{{ node.role }}.conf.j2"
        dest: "{{ lab_dir }}/rendered/{{ node.name }}.conf"
        mode: "0644"
      loop: "{{ fabric_nodes }}"
      loop_control:
        loop_var: node
        label: "{{ node.name }}"
