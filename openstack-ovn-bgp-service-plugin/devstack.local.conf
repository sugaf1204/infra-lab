[[local|localrc]]
# setup-devstack.sh inserts HOST_IP and a per-VM ADMIN_PASSWORD here.
DATABASE_PASSWORD=$ADMIN_PASSWORD
RABBIT_PASSWORD=$ADMIN_PASSWORD
SERVICE_PASSWORD=$ADMIN_PASSWORD
LOGFILE=$DEST/logs/stack.sh.log

Q_AGENT=ovn
OVN_BUILD_FROM_SOURCE=True
OVN_BRANCH=v26.03.3
OVS_BRANCH=v3.7.1
OVN_AGENT_EXTENSIONS=metadata,ovn-bgp
NEUTRON_BGP_PEER_BRIDGES=br-bgp-0
OVN_L3_CREATE_PUBLIC_NETWORK=False
NEUTRON_CREATE_INITIAL_NETWORKS=False
PUBLIC_INTERFACE=
Q_ASSIGN_GATEWAY_TO_PUBLIC_BRIDGE=False
PHYSICAL_NETWORK=public
PUBLIC_PHYSICAL_NETWORK=public
LIBVIRT_TYPE=qemu

enable_service ovn-northd ovn-controller q-ovn-agent q-ovn-bgp
disable_service q-agt q-l3 q-dhcp q-meta q-ovn-metadata-agent
disable_service cinder c-api c-sch c-vol horizon tempest

[[post-config|/$Q_PLUGIN_CONF_FILE]]
[ovn]
enable_distributed_floating_ip = true
