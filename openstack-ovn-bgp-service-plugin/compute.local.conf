[[local|localrc]]
# setup-devstack.sh inserts HOST_IP, SERVICE_HOST and the shared password.
DATABASE_PASSWORD=$ADMIN_PASSWORD
RABBIT_PASSWORD=$ADMIN_PASSWORD
SERVICE_PASSWORD=$ADMIN_PASSWORD
MYSQL_HOST=$SERVICE_HOST
RABBIT_HOST=$SERVICE_HOST
Q_HOST=$SERVICE_HOST
LOGFILE=$DEST/logs/stack.sh.log

Q_AGENT=ovn
OVN_BUILD_FROM_SOURCE=True
OVN_BRANCH=v26.03.3
OVS_BRANCH=v3.7.1
OVN_AGENT_EXTENSIONS=metadata,ovn-bgp
NEUTRON_BGP_PEER_BRIDGES=br-bgp-0,br-bgp-1
OVN_L3_CREATE_PUBLIC_NETWORK=False
NEUTRON_CREATE_INITIAL_NETWORKS=False
PUBLIC_INTERFACE=
Q_ASSIGN_GATEWAY_TO_PUBLIC_BRIDGE=False
PHYSICAL_NETWORK=public
PUBLIC_PHYSICAL_NETWORK=public
LIBVIRT_TYPE=qemu

NOVA_VNC_ENABLED=True
NOVNCPROXY_URL=http://$SERVICE_HOST:6080/vnc_lite.html
VNCSERVER_LISTEN=$HOST_IP
VNCSERVER_PROXYCLIENT_ADDRESS=$HOST_IP

disable_all_services
enable_service n-cpu placement-client ovn-controller q-ovn-agent ovs-vswitchd ovsdb-server
