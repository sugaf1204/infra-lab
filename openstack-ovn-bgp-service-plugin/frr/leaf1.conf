! データセンター向けプロファイル（BGP 設定やタイマーの最適化）
frr defaults datacenter
hostname leaf1
!
! --- プレフィックスリスト & コミュニティリスト ---
! /32 ホストルートのみを許可
ip prefix-list HOST-ROUTES permit 0.0.0.0/0 ge 32
! chassis（OpenStack ノード）から広報される経路に付与された BGP コミュニティ
bgp community-list standard CHASSIS-HOSTS permit 65233:42
!
! --- ルートマップ ---
! /32 かつ指定の BGP コミュニティを持つ経路のみを許可
route-map CHASSIS-HOSTS permit 10
 match ip address prefix-list HOST-ROUTES
 match community CHASSIS-HOSTS
!
! --- BGP 設定 ---
router bgp 65232
 bgp router-id 192.0.2.1
 ! IPv4 ユニキャストの自動有効化を無効化
 no bgp default ipv4-unicast
 ! 異なる AS からの経路でもパス長が同じであれば ECMP を許可
 bgp bestpath as-path multipath-relax
 !
 ! 対向 chassis（controller / compute）向けピアグループ
 neighbor CHASSIS peer-group
 neighbor CHASSIS remote-as external
 neighbor CHASSIS timers 3 9
 !
 ! 対向 Spine 向けピアグループ
 neighbor SPINE peer-group
 neighbor SPINE remote-as external
 neighbor SPINE timers 3 9
 !
 ! インターフェース指定 eBGP Unnumbered ピアリング
 neighbor eth1 interface peer-group CHASSIS
 neighbor eth2 interface peer-group SPINE
 neighbor eth3 interface peer-group CHASSIS
 !
 address-family ipv4 unicast
  ! chassis ピアを有効化
  neighbor CHASSIS activate
  ! chassis からは正規コミュニティを持つ /32 ホストルートのみ受信
  neighbor CHASSIS route-map CHASSIS-HOSTS in
  ! chassis に向けてデフォルトルートを生成・広報
  neighbor CHASSIS default-originate
  !
  ! Spine ピアを有効化
  neighbor SPINE activate
  ! Spine からは /32 ルート（Spine ループバック）のみ受信
  neighbor SPINE prefix-list HOST-ROUTES in
  ! Spine へは chassis から受け取った VM /32 ホストルートのみ転送
  neighbor SPINE route-map CHASSIS-HOSTS out
  !
  ! ECMP（最大 2 パス）
  maximum-paths 2
 exit-address-family
!
