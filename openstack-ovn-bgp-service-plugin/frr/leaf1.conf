frr defaults traditional
hostname leaf1
!
ip prefix-list HOST-ROUTES permit 0.0.0.0/0 ge 32
bgp community-list standard CHASSIS-HOSTS permit 65233:42
!
route-map CHASSIS-HOSTS permit 10
 match ip address prefix-list HOST-ROUTES
 match community CHASSIS-HOSTS
!
ip prefix-list PROBE permit 203.0.113.10/32
!
router bgp 65232
 bgp router-id 192.0.2.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor eth1 interface remote-as 65231
 neighbor eth1 timers 3 9
 neighbor eth2 interface remote-as 65233
 neighbor eth3 interface remote-as 65235
 neighbor eth3 timers 3 9
 !
 address-family ipv4 unicast
  neighbor eth1 activate
  neighbor eth1 route-map CHASSIS-HOSTS in
  neighbor eth1 default-originate
  neighbor eth2 activate
  neighbor eth2 prefix-list PROBE in
  neighbor eth2 route-map CHASSIS-HOSTS out
  neighbor eth3 activate
  neighbor eth3 route-map CHASSIS-HOSTS in
  neighbor eth3 default-originate
 exit-address-family
