frr defaults traditional
hostname leaf2
!
ip prefix-list CHASSIS-HOSTS permit 203.0.113.31/32
ip prefix-list CHASSIS-HOSTS permit 203.0.113.32/32
ip prefix-list CHASSIS-HOSTS permit 10.53.0.0/24 ge 32
ip prefix-list PROBE permit 203.0.113.10/32
ipv6 prefix-list DEFAULT6 permit ::/0
ipv6 prefix-list DENY6 deny ::/0 le 128
!
router bgp 65234
 bgp router-id 192.0.2.2
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor eth1 interface remote-as 65231
 neighbor eth1 timers 3 9
 neighbor eth2 interface remote-as 65233
 neighbor eth3 interface remote-as 65235
 neighbor eth3 timers 3 9
 !
 address-family ipv4 unicast
  neighbor eth1 activate
  neighbor eth1 prefix-list CHASSIS-HOSTS in
  neighbor eth1 prefix-list PROBE out
  neighbor eth2 activate
  neighbor eth2 prefix-list PROBE in
  neighbor eth2 prefix-list CHASSIS-HOSTS out
  neighbor eth3 activate
  neighbor eth3 prefix-list CHASSIS-HOSTS in
  neighbor eth3 prefix-list PROBE out
 exit-address-family
 address-family ipv6 unicast
  neighbor eth1 activate
  neighbor eth1 prefix-list DENY6 in
  neighbor eth1 prefix-list DEFAULT6 out
  neighbor eth1 default-originate
  neighbor eth3 activate
  neighbor eth3 prefix-list DENY6 in
  neighbor eth3 prefix-list DEFAULT6 out
  neighbor eth3 default-originate
 exit-address-family
