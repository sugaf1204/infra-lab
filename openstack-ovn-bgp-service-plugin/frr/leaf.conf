frr defaults traditional
hostname leaf
!
ip prefix-list TENANT-HOSTS permit 10.53.0.0/24 ge 32
ip prefix-list PROBE permit 203.0.113.10/32
!
router bgp 65232
 bgp router-id 192.0.2.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor eth1 interface remote-as 65231
 neighbor 192.0.2.0 remote-as 65233
 !
 address-family ipv4 unicast
  neighbor eth1 activate
  neighbor eth1 prefix-list TENANT-HOSTS in
  neighbor eth1 default-originate
  neighbor 192.0.2.0 activate
  neighbor 192.0.2.0 prefix-list PROBE in
  neighbor 192.0.2.0 prefix-list TENANT-HOSTS out
 exit-address-family
