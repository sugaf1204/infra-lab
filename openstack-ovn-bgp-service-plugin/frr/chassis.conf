frr defaults traditional
hostname ovn-chassis
!
ip prefix-list DEFAULT permit 0.0.0.0/0
ip prefix-list TENANT-HOSTS permit 10.53.0.0/24 ge 32
!
route-map INSTALL-DEFAULT permit 10
 match ip address prefix-list DEFAULT
!
! Keep BGP routes out of the VM management routing table.
route-map KEEP-MANAGEMENT deny 10
!
ip protocol bgp route-map KEEP-MANAGEMENT
!
vrf ovnvrf10
 ip protocol bgp route-map INSTALL-DEFAULT
exit-vrf
!
router bgp 65231 vrf ovnvrf10
 bgp router-id 198.51.100.1
 address-family ipv4 unicast
  import vrf default
 exit-address-family
!
router bgp 65231 vrf ovnvrf42
 bgp router-id 198.51.100.1
 address-family ipv4 unicast
  redistribute kernel
 exit-address-family
!
router bgp 65231
 bgp router-id 198.51.100.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor br-bgp-0 interface remote-as 65232
 !
 address-family ipv4 unicast
  import vrf ovnvrf42
  neighbor br-bgp-0 activate
  neighbor br-bgp-0 prefix-list DEFAULT in
  neighbor br-bgp-0 prefix-list TENANT-HOSTS out
 exit-address-family
