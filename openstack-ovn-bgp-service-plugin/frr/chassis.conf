frr defaults traditional
hostname ovn-chassis
!
ip prefix-list PROBE permit 203.0.113.10/32
ipv6 prefix-list DEFAULT6 permit ::/0
ipv6 prefix-list DENY6 deny ::/0 le 128
ip prefix-list CHASSIS-HOSTS permit 203.0.113.31/32
ip prefix-list CHASSIS-HOSTS permit 10.53.0.0/24 ge 32
!
route-map INSTALL-PROBE permit 10
 match ip address prefix-list PROBE
!
route-map INSTALL-DEFAULT6 permit 10
 match ipv6 address prefix-list DEFAULT6
!
! Keep BGP routes out of the VM management routing table.
route-map KEEP-MANAGEMENT deny 10
!
ip protocol bgp route-map KEEP-MANAGEMENT
ipv6 protocol bgp route-map KEEP-MANAGEMENT
!
vrf ovnvrf10
 ip protocol bgp route-map INSTALL-PROBE
 ipv6 protocol bgp route-map INSTALL-DEFAULT6
exit-vrf
!
router bgp 65231 vrf ovnvrf10
 bgp router-id 203.0.113.31
 bgp bestpath as-path multipath-relax
 address-family ipv4 unicast
  import vrf default
  maximum-paths 2
 exit-address-family
 address-family ipv6 unicast
  import vrf default
  maximum-paths 2
 exit-address-family
!
router bgp 65231 vrf ovnvrf42
 bgp router-id 203.0.113.31
 address-family ipv4 unicast
  redistribute kernel
 exit-address-family
!
router bgp 65231
 bgp router-id 203.0.113.31
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 no bgp ebgp-requires-policy
 neighbor br-bgp-0 interface remote-as 65232
 neighbor br-bgp-0 timers 3 9
 neighbor br-bgp-1 interface remote-as 65234
 neighbor br-bgp-1 timers 3 9
 !
 address-family ipv4 unicast
  import vrf ovnvrf42
  network 203.0.113.31/32
  maximum-paths 2
  neighbor br-bgp-0 activate
  neighbor br-bgp-0 prefix-list PROBE in
  neighbor br-bgp-0 prefix-list CHASSIS-HOSTS out
  neighbor br-bgp-1 activate
  neighbor br-bgp-1 prefix-list PROBE in
  neighbor br-bgp-1 prefix-list CHASSIS-HOSTS out
 exit-address-family
 address-family ipv6 unicast
  maximum-paths 2
  neighbor br-bgp-0 activate
  neighbor br-bgp-0 prefix-list DEFAULT6 in
  neighbor br-bgp-0 prefix-list DENY6 out
  neighbor br-bgp-1 activate
  neighbor br-bgp-1 prefix-list DEFAULT6 in
  neighbor br-bgp-1 prefix-list DENY6 out
 exit-address-family
