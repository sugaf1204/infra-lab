! データセンター向けプロファイル（BGP 設定やタイマーの最適化）
frr defaults datacenter
hostname spine
!
! --- BGP 設定 ---
router bgp 65233
 bgp router-id 203.0.113.10
 ! IPv4 ユニキャストの自動有効化を無効化
 no bgp default ipv4-unicast
 ! 異なる AS からの経路でもパス長が同じであれば ECMP を許可
 bgp bestpath as-path multipath-relax
 !
 ! 対向 Leaf 向けピアグループ
 neighbor LEAVES peer-group
 neighbor LEAVES remote-as external
 neighbor LEAVES timers 3 9
 !
 ! Leaf への接続（eth1: leaf1, eth2: leaf2）- eBGP Unnumbered
 neighbor eth1 interface peer-group LEAVES
 neighbor eth2 interface peer-group LEAVES
 !
 address-family ipv4 unicast
  neighbor LEAVES activate
  ! Leaf 2 台を経由したテナント VM 宛て ECMP（最大 2 パス）
  maximum-paths 2
  ! 自ノードのループバック IP を Fabric に広報（疎通確認・プローブ用）
  network 203.0.113.10/32
 exit-address-family
!
