name: ovn-bgp

mgmt:
  network: ovn-bgp-mgmt
  ipv4-subnet: 172.30.12.0/24

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.4.1
    binds:
      - ../common/frr/daemons:/etc/frr/daemons:ro
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
  nodes:
    leaf:
      binds:
        - frr/leaf.conf:/etc/frr/frr.conf:ro
      exec:
        - ip address replace 192.0.2.1/31 dev eth2
    spine:
      binds:
        - frr/spine.conf:/etc/frr/frr.conf:ro
      exec:
        - ip address replace 192.0.2.0/31 dev eth1
        - ip address replace 203.0.113.10/32 dev lo
  links:
    - type: host
      endpoint:
        node: leaf
        interface: eth1
      host-interface: ovnbgp-uplink
    - endpoints: ["leaf:eth2", "spine:eth1"]
