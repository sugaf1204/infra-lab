k8sServiceHost: cilium-l3-control-plane
k8sServicePort: 6443
ipam:
  mode: kubernetes
routingMode: native
ipv4NativeRoutingCIDR: 10.220.0.0/16
autoDirectNodeRoutes: false
endpointRoutes:
  enabled: true
enableIPv4Masquerade: true
bpf:
  hostLegacyRouting: true
  masquerade: false
bgpControlPlane:
  enabled: true
kubeProxyReplacement: true
socketLB:
  enabled: false
devices: "k8s-tor+,lo"
nodePort:
  directRoutingDevice: "lo"
rollOutCiliumPods: true
image:
  useDigest: false
envoy:
  image:
    useDigest: false
operator:
  replicas: 1
  image:
    useDigest: false
