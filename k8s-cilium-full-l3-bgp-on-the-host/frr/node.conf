frr defaults traditional
hostname node-frr
!
ip prefix-list WORKLOADS seq 10 permit 10.220.0.0/20 ge 24 le 24
ip prefix-list WORKLOADS seq 20 permit 10.220.250.10/32
ip prefix-list CLIENTS permit 10.220.240.12/30
ip prefix-list DENY-ALL deny 0.0.0.0/0 le 32
!
interface eth1
 no ipv6 nd suppress-ra
 ipv6 nd ra-interval 3
!
router bgp 65202
 bgp router-id 10.220.255.2
 no bgp default ipv4-unicast
 neighbor eth1 interface remote-as 65201
 neighbor eth2 interface remote-as 65101
 !
 address-family ipv4 unicast
  neighbor eth1 activate
  neighbor eth1 prefix-list WORKLOADS in
  neighbor eth1 prefix-list DENY-ALL out
  neighbor eth2 activate
  neighbor eth2 prefix-list CLIENTS in
  neighbor eth2 prefix-list WORKLOADS out
 exit-address-family
!
