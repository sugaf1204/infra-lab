frr defaults traditional
hostname node-frr
!
ip prefix-list CILIUM permit 10.220.250.0/24 ge 32
ip prefix-list CILIUM permit 10.220.255.10/32
ip prefix-list PODS permit 10.220.0.0/20 ge 32
ip prefix-list WORKLOADS permit 10.220.0.0/20 ge 32
ip prefix-list WORKLOADS permit 10.220.250.0/24 ge 32
ip prefix-list WORKLOADS permit 10.220.255.10/32
ip prefix-list CLIENTS permit 10.220.240.0/24 ge 32
ip prefix-list DENY-ALL deny 0.0.0.0/0 le 32
!
interface eth1
 no ipv6 nd suppress-ra
 ipv6 nd ra-interval 3
!
router bgp 65202
 bgp router-id 10.220.255.2
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor eth1 interface remote-as 65201
 neighbor eth2 interface remote-as 65101
 neighbor eth3 interface remote-as 65204
 neighbor eth4 interface remote-as 65102
 !
 address-family ipv4 unicast
  neighbor eth1 activate
  neighbor eth1 prefix-list CILIUM in
  neighbor eth1 prefix-list DENY-ALL out
  neighbor eth2 activate
  neighbor eth2 prefix-list CLIENTS in
  neighbor eth2 prefix-list WORKLOADS out
  neighbor eth3 activate
  neighbor eth3 prefix-list PODS in
  neighbor eth3 default-originate
  neighbor eth4 activate
  neighbor eth4 prefix-list CLIENTS in
  neighbor eth4 prefix-list WORKLOADS out
  maximum-paths 2
 exit-address-family
!
