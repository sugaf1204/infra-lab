frr defaults traditional
hostname kube-host-frr
!
ip prefix-list DEFAULT permit 0.0.0.0/0
ip prefix-list DENY-ALL deny 0.0.0.0/0 le 32
!
router bgp 65204 vrf cilium-egress
 bgp router-id 10.220.255.4
 no bgp default ipv4-unicast
 neighbor cilium-routes interface remote-as 65202
 !
 address-family ipv4 unicast
  neighbor cilium-routes activate
  neighbor cilium-routes prefix-list DEFAULT in
  neighbor cilium-routes prefix-list DENY-ALL out
 exit-address-family
!
