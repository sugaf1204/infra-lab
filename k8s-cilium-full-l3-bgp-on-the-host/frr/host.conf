frr defaults traditional
hostname cilium-host-frr
!
ip prefix-list PODS permit 10.220.0.0/20 ge 32
ip prefix-list VIPS permit 10.220.250.0/24 ge 32
ip prefix-list DEFAULT permit 0.0.0.0/0
ip prefix-list EXPORT permit 10.220.0.0/20 ge 32
ip prefix-list EXPORT permit 10.220.250.0/24 ge 32
ip prefix-list EXPORT permit 10.220.255.10/32
ip prefix-list DENY-ALL deny 0.0.0.0/0 le 32
!
route-map PODS permit 10
 match ip address prefix-list PODS
!
route-map CONTROL-PLANE-ONLY deny 10
!
route-map INSTALL-DEFAULT permit 10
 match ip address prefix-list DEFAULT
!
ip protocol bgp route-map CONTROL-PLANE-ONLY
!
vrf cilium-egress
 ip protocol bgp route-map INSTALL-DEFAULT
exit-vrf
!
router bgp 65202
 bgp router-id 10.220.255.2
 no bgp default ipv4-unicast
 ! The VIP update has the local Cilium address as its next hop.
 bgp allow-martian-nexthop
 neighbor CILIUM peer-group
 neighbor CILIUM remote-as 65201
 neighbor CILIUM ebgp-multihop 2
 bgp listen range 10.220.255.10/32 peer-group CILIUM
 !
 address-family ipv4 unicast
  network 10.220.255.10/32
  redistribute kernel route-map PODS
  neighbor CILIUM activate
  neighbor CILIUM prefix-list VIPS in
  neighbor CILIUM prefix-list DENY-ALL out
 exit-address-family
!
router bgp 65202 vrf cilium-egress
 bgp router-id 10.220.255.2
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor cilium-tor1 interface remote-as 65101
 neighbor cilium-tor2 interface remote-as 65102
 !
 address-family ipv4 unicast
  import vrf default
  neighbor cilium-tor1 activate
  neighbor cilium-tor1 prefix-list DEFAULT in
  neighbor cilium-tor1 prefix-list EXPORT out
  neighbor cilium-tor2 activate
  neighbor cilium-tor2 prefix-list DEFAULT in
  neighbor cilium-tor2 prefix-list EXPORT out
  maximum-paths 2
 exit-address-family
!
