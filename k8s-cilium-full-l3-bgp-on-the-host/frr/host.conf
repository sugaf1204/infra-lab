frr defaults traditional
hostname kube-host-frr
!
ip prefix-list DEFAULT permit 0.0.0.0/0
ip prefix-list PODS permit 10.220.0.0/20 ge 32
!
route-map PODS permit 10
 match ip address prefix-list PODS
!
router bgp 65204
 bgp router-id 10.220.255.4
 address-family ipv4 unicast
  redistribute kernel route-map PODS
 exit-address-family
!
router bgp 65204 vrf cilium-egress
 bgp router-id 10.220.255.4
 no bgp default ipv4-unicast
 neighbor cilium-routes interface remote-as 65202
 !
 address-family ipv4 unicast
  neighbor cilium-routes activate
  neighbor cilium-routes prefix-list DEFAULT in
  neighbor cilium-routes prefix-list PODS out
  import vrf default
 exit-address-family
!
