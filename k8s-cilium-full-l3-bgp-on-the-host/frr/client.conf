frr defaults traditional
hostname client
!
ip prefix-list WORKLOADS permit 10.220.0.0/20 ge 32
ip prefix-list WORKLOADS permit 10.220.250.0/24 ge 32
ip prefix-list WORKLOADS permit 10.220.255.10/31 ge 32
ipv6 prefix-list DEFAULT-V6 permit ::/0
ipv6 prefix-list DENY-V6 deny ::/0 le 128
ip prefix-list CLIENTS permit 10.220.240.0/24 ge 32
!
router bgp 65203
 bgp router-id 10.220.240.14
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor eth1 interface remote-as 65101
 neighbor eth1 timers 3 9
 neighbor eth2 interface remote-as 65102
 neighbor eth2 timers 3 9
 !
 address-family ipv4 unicast
  network 10.220.240.14/32
  neighbor eth1 activate
  neighbor eth1 prefix-list WORKLOADS in
  neighbor eth1 prefix-list CLIENTS out
  neighbor eth2 activate
  neighbor eth2 prefix-list WORKLOADS in
  neighbor eth2 prefix-list CLIENTS out
  maximum-paths 2
 exit-address-family
 address-family ipv6 unicast
  neighbor eth1 activate
  neighbor eth1 prefix-list DEFAULT-V6 in
  neighbor eth1 prefix-list DENY-V6 out
  neighbor eth2 activate
  neighbor eth2 prefix-list DEFAULT-V6 in
  neighbor eth2 prefix-list DENY-V6 out
  maximum-paths 2
 exit-address-family
!
