frr defaults traditional
hostname client
!
ip prefix-list DEFAULT permit 0.0.0.0/0
ip prefix-list CLIENTS permit 10.220.240.0/24 ge 32
!
router bgp 65203
 bgp router-id 10.220.240.14
 no bgp default ipv4-unicast
 neighbor eth1 interface remote-as 65101
 !
 address-family ipv4 unicast
  network 10.220.240.14/32
  neighbor eth1 activate
  neighbor eth1 prefix-list DEFAULT in
  neighbor eth1 prefix-list CLIENTS out
 exit-address-family
!
