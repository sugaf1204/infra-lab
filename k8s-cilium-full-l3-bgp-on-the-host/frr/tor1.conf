frr defaults traditional
hostname tor1
!
ip route 10.220.0.0/16 Null0
ip prefix-list WORKLOADS seq 10 permit 10.220.0.0/20 ge 24 le 24
ip prefix-list WORKLOADS seq 20 permit 10.220.250.10/32
ip prefix-list CLIENTS permit 10.220.240.12/30
!
router bgp 65101
 bgp router-id 10.220.255.1
 no bgp default ipv4-unicast
 neighbor eth1 interface remote-as 65202
 !
 address-family ipv4 unicast
  network 10.220.240.12/30
  neighbor eth1 activate
  neighbor eth1 prefix-list WORKLOADS in
  neighbor eth1 prefix-list CLIENTS out
 exit-address-family
!
