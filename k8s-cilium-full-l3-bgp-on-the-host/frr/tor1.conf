frr defaults traditional
hostname tor1
!
ip route 10.220.0.0/16 Null0
ip prefix-list WORKLOADS seq 10 permit 10.220.0.0/20 ge 24 le 24
ip prefix-list WORKLOADS seq 20 permit 10.220.250.10/32
ip prefix-list DENY-ALL seq 10 deny 0.0.0.0/0 le 32
!
router bgp 65101
 bgp router-id 10.220.240.1
 neighbor 10.220.240.2 remote-as 65201
 !
 address-family ipv4 unicast
  neighbor 10.220.240.2 prefix-list WORKLOADS in
  neighbor 10.220.240.2 prefix-list DENY-ALL out
 exit-address-family
!
