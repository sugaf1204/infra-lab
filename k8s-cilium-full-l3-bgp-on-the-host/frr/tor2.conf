frr defaults traditional
hostname tor2
!
ip route 10.220.0.0/16 Null0
ip prefix-list WORKLOADS seq 10 permit 10.220.0.0/20 ge 24 le 24
ip prefix-list WORKLOADS seq 20 permit 10.220.250.10/32
ip prefix-list FABRIC seq 10 permit 10.220.0.0/20 ge 24 le 24
ip prefix-list FABRIC seq 20 permit 10.220.240.12/30
ip prefix-list DENY-ALL seq 10 deny 0.0.0.0/0 le 32
!
router bgp 65102
 bgp router-id 10.220.240.5
 neighbor 10.220.240.6 remote-as 65202
 neighbor 10.220.240.9 remote-as 65101
 !
 address-family ipv4 unicast
  neighbor 10.220.240.6 prefix-list WORKLOADS in
  neighbor 10.220.240.6 prefix-list DENY-ALL out
  neighbor 10.220.240.9 prefix-list FABRIC in
  neighbor 10.220.240.9 prefix-list WORKLOADS out
 exit-address-family
!
