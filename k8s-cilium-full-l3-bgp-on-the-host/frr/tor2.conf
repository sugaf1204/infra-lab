frr defaults traditional
hostname tor2
!
ip prefix-list WORKLOADS permit 10.220.0.0/20 ge 32
ip prefix-list WORKLOADS permit 10.220.250.0/24 ge 32
ip prefix-list WORKLOADS permit 10.220.255.10/31 ge 32
ip prefix-list NODES permit 10.220.0.0/20 ge 32
ip prefix-list NODES permit 10.220.255.10/31 ge 32
ip prefix-list NODES permit 0.0.0.0/0
ip prefix-list CLIENTS permit 10.220.240.0/24 ge 32
!
router bgp 65102
 bgp router-id 10.220.255.3
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor eth1 interface remote-as 65202
 neighbor eth1 timers 3 9
 neighbor eth2 interface remote-as 65203
 neighbor eth2 timers 3 9
 neighbor eth3 interface remote-as 65204
 neighbor eth3 timers 3 9
 !
 address-family ipv4 unicast
  neighbor eth1 activate
  neighbor eth1 prefix-list WORKLOADS in
  neighbor eth1 prefix-list NODES out
  neighbor eth1 default-originate
  neighbor eth2 activate
  neighbor eth2 prefix-list CLIENTS in
  neighbor eth2 prefix-list WORKLOADS out
  neighbor eth3 activate
  neighbor eth3 prefix-list WORKLOADS in
  neighbor eth3 prefix-list NODES out
  neighbor eth3 default-originate
  maximum-paths 2
 exit-address-family
!
