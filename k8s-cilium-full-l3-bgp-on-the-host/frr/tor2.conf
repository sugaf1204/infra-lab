! データセンター向けプロファイル（BGP 設定やタイマーの最適化）
frr defaults datacenter
hostname tor2
!
! --- プレフィックスリスト（経路フィルタ） ---
! ノードおよび外部クライアントから受信する経路を /32（ホストルート / Node IP / Pod IP / VIP）のみに限定
ip prefix-list HOST-ROUTES permit 0.0.0.0/0 ge 32
! ノードへ広報する経路をデフォルトルート（0.0.0.0/0）のみに限定
ip prefix-list DEFAULT-ONLY permit 0.0.0.0/0
!
! --- BGP 設定 ---
router bgp 65102
 bgp router-id 10.220.255.3
 ! IPv4 ユニキャストの自動有効化を無効化
 no bgp default ipv4-unicast
 ! 異なる AS からの経路でもパス長が同じであれば ECMP を許可
 bgp bestpath as-path multipath-relax
 !
 ! Kubernetes ノード（control plane / worker）向けピアグループ
 neighbor NODES peer-group
 neighbor NODES remote-as external
 neighbor NODES timers 3 9
 !
 ! 外部クライアント向けピアグループ
 neighbor CLIENTS peer-group
 neighbor CLIENTS remote-as external
 neighbor CLIENTS timers 3 9
 !
 ! インターフェース指定 eBGP Unnumbered ピアリング（eth1: control plane, eth2: client, eth3: worker）
 neighbor eth1 interface peer-group NODES
 neighbor eth2 interface peer-group CLIENTS
 neighbor eth3 interface peer-group NODES
 !
 address-family ipv4 unicast
  ! ノード向けピアを有効化
  neighbor NODES activate
  ! ノードからは /32 ホストルート（Node IP, Pod IP, Service VIP）のみ受信
  neighbor NODES prefix-list HOST-ROUTES in
  ! ノードへはデフォルトルートのみを送信
  neighbor NODES prefix-list DEFAULT-ONLY out
  ! ノードに向けてデフォルトルートを生成・広報
  neighbor NODES default-originate
  !
  ! クライアント向けピアを有効化
  neighbor CLIENTS activate
  ! クライアントからは /32（クライアント自身の IP）を受信
  neighbor CLIENTS prefix-list HOST-ROUTES in
  ! クライアントへノード・Pod・VIP の /32 ホストルートを広報
  neighbor CLIENTS prefix-list HOST-ROUTES out
  !
  ! ECMP（最大 2 パス）
  maximum-paths 2
 exit-address-family
!
