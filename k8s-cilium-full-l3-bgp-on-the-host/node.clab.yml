name: cilium-l3
mgmt:
  network: clab-cilium-l3-node
  skip-when-unused: true
topology:
  nodes:
    host-frr:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      network-mode: host
      binds:
        - ../common/frr/daemons:/etc/frr/daemons:ro
        - .lab-state/kubeadm/frr.conf:/etc/frr/frr.conf:ro
