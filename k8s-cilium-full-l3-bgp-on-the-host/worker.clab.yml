name: cilium-l3
mgmt:
  network: clab-cilium-l3-worker
  skip-when-unused: true
topology:
  nodes:
    host-frr:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      network-mode: host
      binds:
        - ../common/frr/daemons:/etc/frr/daemons:ro
        - frr/worker.conf:/etc/frr/frr.conf:ro
