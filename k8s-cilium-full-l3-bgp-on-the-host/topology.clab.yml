name: cilium-l3
mgmt:
  network: clab-cilium-l3-mgmt
  skip-when-unused: true
topology:
  groups:
    router:
      network-mode: none
      image: quay.io/frrouting/frr:10.4.1
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.fib_multipath_hash_policy: 1
        net.ipv6.conf.all.disable_ipv6: 0
        net.ipv6.conf.default.disable_ipv6: 0
        net.ipv6.conf.default.accept_ra_defrtr: 0
      binds:
        - ../common/frr/daemons:/etc/frr/daemons:ro
    k8s-frr:
      image: quay.io/frrouting/frr:10.4.1
      binds:
        - ../common/frr/daemons:/etc/frr/daemons:ro
      exec:
        - sysctl -w net.ipv4.ip_forward=1 net.ipv4.fib_multipath_hash_policy=1 net.ipv4.conf.all.rp_filter=0 net.ipv4.conf.default.rp_filter=0 net.ipv4.conf.k8s-tor1.rp_filter=0 net.ipv4.conf.k8s-tor2.rp_filter=0 net.ipv6.conf.all.disable_ipv6=0 net.ipv6.conf.default.disable_ipv6=0 net.ipv6.conf.default.accept_ra_defrtr=0
        - ip route replace 127.0.0.0/8 dev lo scope link
        - sh -c 'ip route del default dev eth0 || true'
  nodes:
    tor1:
      kind: linux
      group: router
      binds:
        - rendered/tor1.conf:/etc/frr/frr.conf:ro
    tor2:
      kind: linux
      group: router
      binds:
        - rendered/tor2.conf:/etc/frr/frr.conf:ro
    client:
      kind: linux
      group: router
      binds:
        - rendered/client.conf:/etc/frr/frr.conf:ro
    node0:
      kind: linux
      group: k8s-frr
      network-mode: container:cilium-l3-control-plane
      binds:
        - rendered/node0.conf:/etc/frr/frr.conf:ro
    node1:
      kind: linux
      group: k8s-frr
      network-mode: container:cilium-l3-worker
      binds:
        - rendered/node1.conf:/etc/frr/frr.conf:ro
  links:
    - endpoints: ["tor1:eth1", "node0:k8s-tor1"]
    - endpoints: ["tor2:eth1", "node0:k8s-tor2"]
    - endpoints: ["tor1:eth3", "node1:k8s-tor1"]
    - endpoints: ["tor2:eth3", "node1:k8s-tor2"]
    - endpoints: ["tor1:eth2", "client:eth1"]
    - endpoints: ["tor2:eth2", "client:eth2"]
