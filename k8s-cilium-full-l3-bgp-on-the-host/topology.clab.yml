name: cilium-l3
mgmt:
  network: clab-cilium-l3-mgmt
  ipv4-subnet: 172.30.13.0/24
topology:
  groups:
    router:
      image: quay.io/frrouting/frr:10.4.1
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv6.conf.all.disable_ipv6: 0
        net.ipv6.conf.default.disable_ipv6: 0
      binds:
        - ../common/frr/daemons:/etc/frr/daemons:ro
  nodes:
    node-frr:
      kind: linux
      group: router
      binds:
        - frr/node.conf:/etc/frr/frr.conf:ro
    tor1:
      kind: linux
      group: router
      binds:
        - frr/tor1.conf:/etc/frr/frr.conf:ro
      exec:
        - ip addr replace 10.220.240.13/30 dev eth2
    client:
      kind: linux
      image: alpine:3.22.1
      cmd: sleep infinity
      exec:
        - ip addr replace 10.220.240.14/30 dev eth1
        - ip route replace 10.220.0.0/20 via 10.220.240.13 dev eth1
        - ip route replace 10.220.250.10/32 via 10.220.240.13 dev eth1
  links:
    - endpoints: ["node-frr:eth2", "tor1:eth1"]
    - endpoints: ["tor1:eth2", "client:eth1"]
    - type: host
      endpoint:
        node: node-frr
        interface: eth1
      host-interface: cilium-uplink
