name: cilium-l3
mgmt:
  network: clab-cilium-l3-mgmt
  skip-when-unused: true
topology:
  groups:
    router:
      network-mode: none
      image: quay.io/frrouting/frr:10.4.1
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv6.conf.all.disable_ipv6: 0
        net.ipv6.conf.default.disable_ipv6: 0
      binds:
        - ../common/frr/daemons:/etc/frr/daemons:ro
  nodes:
    tor1:
      kind: linux
      group: router
      binds:
        - frr/tor1.conf:/etc/frr/frr.conf:ro
    tor2:
      kind: linux
      group: router
      binds:
        - frr/tor2.conf:/etc/frr/frr.conf:ro
    client:
      kind: linux
      group: router
      binds:
        - frr/client.conf:/etc/frr/frr.conf:ro
      exec:
        - ip -4 addr replace 10.220.240.14/32 dev lo
    host-frr:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      network-mode: host
      binds:
        - ../common/frr/daemons:/etc/frr/daemons:ro
        - frr/host.conf:/etc/frr/frr.conf:ro
  links:
    - type: host
      endpoint: {node: tor1, interface: eth1}
      host-interface: cilium-tor1
    - type: host
      endpoint: {node: tor2, interface: eth1}
      host-interface: cilium-tor2
    - endpoints: ["tor1:eth2", "client:eth1"]
    - endpoints: ["tor2:eth2", "client:eth2"]
