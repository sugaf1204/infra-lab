name: cilium-l3
mgmt:
  network: clab-cilium-l3-mgmt
  skip-when-unused: true
topology:
  groups:
    router:
      network-mode: none
      image: quay.io/frrouting/frr:10.4.1
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.fib_multipath_hash_policy: 1
        net.ipv6.conf.all.disable_ipv6: 0
        net.ipv6.conf.default.disable_ipv6: 0
        net.ipv6.conf.default.accept_ra_defrtr: 0
      binds:
        - ../common/frr/daemons:/etc/frr/daemons:ro
  nodes:
    tor1:
      kind: linux
      group: router
      binds:
        - rendered/tor1.conf:/etc/frr/frr.conf:ro
    tor2:
      kind: linux
      group: router
      binds:
        - rendered/tor2.conf:/etc/frr/frr.conf:ro
    client:
      kind: linux
      group: router
      binds:
        - rendered/client.conf:/etc/frr/frr.conf:ro
  links:
    - endpoints: ["tor1:eth2", "client:eth1"]
    - endpoints: ["tor2:eth2", "client:eth2"]
