apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: native-workloads
  labels:
    lab: cilium-l3
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchLabels:
          lab: cilium-l3
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: host-frr
spec:
  ebgpMultihop: 2
  timers:
    connectRetryTimeSeconds: 5
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          lab: cilium-l3
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: host-frr
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: cilium-l3-node
  bgpInstances:
    - name: host-frr
      localASN: 65201
      peers:
        - name: host-frr
          peerASN: 65202
          peerAddress: 10.220.255.2
          peerConfigRef:
            name: host-frr
---
apiVersion: cilium.io/v2
kind: CiliumBGPNodeConfigOverride
metadata:
  name: cilium-l3-node
spec:
  bgpInstances:
    - name: host-frr
      peers:
        - name: host-frr
          localAddress: 10.220.255.10
