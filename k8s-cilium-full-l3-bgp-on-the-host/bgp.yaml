# Cilium BGP Control Plane 設定
# Service (LoadBalancer IP) の BGP 広報定義
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: native-workloads
  labels:
    lab: cilium-l3
spec:
  advertisements:
    # Service の LoadBalancerIP を BGP で広報
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchLabels:
          lab: cilium-l3
---
# Cilium からホスト上の FRR へのピア接続プロファイル
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: host-frr
spec:
  # マルチホップ eBGP（127.0.0.2 -> 127.0.0.1）
  ebgpMultihop: 2
  timers:
    connectRetryTimeSeconds: 5
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          lab: cilium-l3
---
# クラスター全体の BGP インスタンス設定（全ノード共通）
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: host-frr
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: host-frr
      # Cilium 側のローカル ASN
      localASN: 65201
      peers:
        - name: host-frr
          # FRR 側の ASN（FRR の local-as 65200 no-prepend replace-as により 65200 として認識）
          peerASN: 65200
          peerAddress: 127.0.0.1
          peerConfigRef:
            name: host-frr
---
# control plane ノード（cilium-l3-node）用の送信元アドレス（127.0.0.2）オーバーライド
apiVersion: cilium.io/v2
kind: CiliumBGPNodeConfigOverride
metadata:
  name: cilium-l3-node
spec:
  bgpInstances:
    - name: host-frr
      peers:
        - name: host-frr
          localAddress: 127.0.0.2
---
# worker ノード（cilium-l3-worker）用の送信元アドレス（127.0.0.2）オーバーライド
apiVersion: cilium.io/v2
kind: CiliumBGPNodeConfigOverride
metadata:
  name: cilium-l3-worker
spec:
  bgpInstances:
    - name: host-frr
      peers:
        - name: host-frr
          localAddress: 127.0.0.2
