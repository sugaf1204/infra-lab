apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: native-workloads
  labels:
    lab: cilium-l3
spec:
  advertisements:
    - advertisementType: PodCIDR
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchLabels:
          lab: cilium-l3
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: node-frr
spec:
  timers:
    connectRetryTimeSeconds: 5
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          lab: cilium-l3
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: node-frr
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: cilium-l3-node
  bgpInstances:
    - name: node-frr
      localASN: 65201
      peers:
        - name: node-frr
          peerASN: 65202
          autoDiscovery:
            mode: Unnumbered
            unnumbered:
              interface: cilium-uplink
          peerConfigRef:
            name: node-frr
