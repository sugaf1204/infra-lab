apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: native-workloads
  labels:
    lab: cilium-l3
spec:
  advertisements:
    - advertisementType: PodCIDR
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchLabels:
          lab: cilium-l3
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: tor
spec:
  timers:
    connectRetryTimeSeconds: 5
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          lab: cilium-l3
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: tor1
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: cilium-l3-control-plane
  bgpInstances:
    - name: tor1
      localASN: 65201
      peers:
        - name: tor1
          peerASN: 65101
          peerAddress: 10.220.240.1
          peerConfigRef:
            name: tor
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: tor2
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: cilium-l3-worker
  bgpInstances:
    - name: tor2
      localASN: 65202
      peers:
        - name: tor2
          peerASN: 65102
          peerAddress: 10.220.240.5
          peerConfigRef:
            name: tor
