# ovn-bgp プラグインは OVN 26.03 以降の dynamic-routing オプションを使うため resolute イメージを使う
images:
  tags:
    ovn_ovsdb_nb: quay.io/airshipit/ovn:ubuntu_resolute
    ovn_ovsdb_sb: quay.io/airshipit/ovn:ubuntu_resolute
    ovn_northd: quay.io/airshipit/ovn:ubuntu_resolute
    ovn_controller: quay.io/airshipit/ovn:ubuntu_resolute
volume:
  ovn_ovsdb_nb:
    class_name: standard
  ovn_ovsdb_sb:
    class_name: standard
network:
  interface:
    tunnel: lo
conf:
  # ovn-controller は dynamic-routing-maintain-vrf で VRF（ovnvrf42/ovnvrf10）とカーネル経路を
  # 作るため NET_ADMIN が要る。既定の openvswitch ユーザーでは Operation not permitted になる。
  ovs_user_name: root
  # public は tenant の flat network、br-bgp-N は Leaf 向けピアブリッジ
  ovn_bridge_mappings: public:br-ex,br-bgp-0:br-bgp-0,br-bgp-1:br-bgp-1
  auto_bridge_add:
    # NIC なしのブリッジ。tenant の flat network（public）と BGP 論理ルーターの相互接続に使う
    br-ex: ""
    br-bgp-0: leaf1
    br-bgp-1: leaf2
pod:
  tolerations:
    ovn_controller:
      enabled: true
      tolerations:
        - key: infra-lab/group
          operator: Exists
          effect: NoSchedule
