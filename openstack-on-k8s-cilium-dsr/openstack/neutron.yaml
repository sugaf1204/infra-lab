images:
  tags:
    bootstrap: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    db_init: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    db_drop: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    ks_user: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    ks_service: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    ks_endpoints: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    neutron_db_sync: quay.io/airshipit/neutron:2026.2-ubuntu_resolute
    neutron_ovn_agent: quay.io/airshipit/neutron:2026.2-ubuntu_resolute
    neutron_server: quay.io/airshipit/neutron:2026.2-ubuntu_resolute
    neutron_rpc_server: quay.io/airshipit/neutron:2026.2-ubuntu_resolute
    neutron_ovn_db_sync: quay.io/airshipit/neutron:2026.2-ubuntu_resolute
    neutron_ovn_maintenance_worker: quay.io/airshipit/neutron:2026.2-ubuntu_resolute
    neutron_periodic_worker: quay.io/airshipit/neutron:2026.2-ubuntu_resolute
network:
  backend:
    - ovn
conf:
  neutron:
    DEFAULT:
      router_distributed: true
      # Neutron 組み込みの ovn-bgp service plugin（bgp-lr-main を OVN に作る）
      service_plugins: ovn-router,ovn-bgp
      # チャート既定の nova を指定すると、ネットワーク AZ が未登録のため network create が 404 になる
      default_availability_zones: ""
  plugins:
    ml2_conf:
      ml2:
        extension_drivers: port_security
        type_drivers: flat
        tenant_network_types: flat
      ml2_type_flat:
        flat_networks: public
      ovn:
        ovn_l3_scheduler: leastloaded
        dns_servers: 1.1.1.1
        neutron_sync_mode: repair
  ovn_agent:
    agent:
      extensions: metadata,ovn-bgp
manifests:
  daemonset_dhcp_agent: false
  daemonset_l3_agent: false
  daemonset_metadata_agent: false
  daemonset_netns_cleanup_cron: false
  daemonset_ovs_agent: false
  statefulset_rpc_server: false
  daemonset_ovn_metadata_agent: false
  # OVN Neutron Agent（metadata + ovn-bgp 拡張）を compute の DaemonSet として動かす
  daemonset_ovn_agent: true
pod:
  tolerations:
    neutron:
      enabled: true
      tolerations:
        - key: infra-lab/group
          operator: Exists
          effect: NoSchedule
