network:
  backend:
    - ovn
bootstrap:
  wait_for_computes:
    enabled: true
conf:
  ceph:
    enabled: false
  nova:
    DEFAULT:
      vif_plugging_is_fatal: true
      vif_plugging_timeout: 300
    libvirt:
      virt_type: kvm
pod:
  tolerations:
    nova:
      enabled: true
      tolerations:
        - key: infra-lab/group
          operator: Exists
          effect: NoSchedule
