#cloud-config
# L4LB のバックエンドになるゲスト。DSR の終端は compute ノードの Cilium が行うため、
# ゲストには接続元を返す HTTP サーバーだけを置く（トンネルや VIP の設定は持たない）。
write_files:
  - path: /usr/local/bin/whoami-server.py
    permissions: "0755"
    content: |
      #!/usr/bin/env python3
      import http.server, socket
      class H(http.server.BaseHTTPRequestHandler):
          def do_GET(self):
              body = f"Hostname: {socket.gethostname()}\nRemoteAddr: {self.client_address[0]}:{self.client_address[1]}\nLocalAddr: {self.connection.getsockname()[0]}\n".encode()
              self.send_response(200)
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)
      http.server.ThreadingHTTPServer(("0.0.0.0", 80), H).serve_forever()
  - path: /etc/systemd/system/whoami.service
    content: |
      [Unit]
      After=network-online.target
      [Service]
      ExecStart=/usr/local/bin/whoami-server.py
      Restart=always
      [Install]
      WantedBy=multi-user.target
runcmd:
  - systemctl daemon-reload
  - systemctl enable --now whoami.service
