#cloud-config
# L4LB（Cilium DSR IPIP）のバックエンドになるゲスト設定。
# IPIP を tunl0 で受け、VIP をループバックに持ち、VIP を送信元にして直接応答する。
write_files:
  - path: /usr/local/bin/whoami-server.py
    permissions: "0755"
    content: |
      #!/usr/bin/env python3
      import http.server, socket
      class H(http.server.BaseHTTPRequestHandler):
          def do_GET(self):
              body = f"Hostname: {socket.gethostname()}\nRemoteAddr: {self.client_address[0]}:{self.client_address[1]}\nLocalAddr: {self.connection.getsockname()[0]}\n".encode()
              self.send_response(200)
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)
      http.server.ThreadingHTTPServer(("0.0.0.0", 80), H).serve_forever()
  - path: /etc/systemd/system/whoami.service
    content: |
      [Unit]
      After=network-online.target
      [Service]
      ExecStartPre=/sbin/modprobe ipip
      ExecStartPre=/sbin/ip link set tunl0 up
      ExecStartPre=/sbin/sysctl -w net.ipv4.conf.all.rp_filter=0 net.ipv4.conf.tunl0.rp_filter=0
      ExecStartPre=/bin/sh -c 'for vip in __VIPS__; do ip addr replace $vip/32 dev lo; done'
      ExecStart=/usr/local/bin/whoami-server.py
      Restart=always
      [Install]
      WantedBy=multi-user.target
runcmd:
  - systemctl daemon-reload
  - systemctl enable --now whoami.service
